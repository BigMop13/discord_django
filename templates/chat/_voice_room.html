{% load static %}
<div class="voice-room">
  <div class="voice-room-status d-flex align-items-center gap-2 mb-3">
    <span id="voiceStatus" class="badge bg-secondary">Disconnected</span>
    <span class="text-muted small">WebRTC mesh - audio is peer-to-peer; this server only relays signaling.</span>
  </div>

  <div class="voice-room-controls d-flex gap-2 mb-4">
    <button type="button" id="voiceJoinBtn" class="btn btn-success">
      <i class="bi bi-headset me-1"></i>Join voice
    </button>
    <button type="button" id="voiceLeaveBtn" class="btn btn-danger" hidden>
      <i class="bi bi-x-circle me-1"></i>Disconnect
    </button>
    <button type="button" id="voiceMuteBtn" class="btn btn-outline-light" disabled title="Mute">
      <i class="bi bi-mic-fill"></i>
    </button>
  </div>

  <h6 class="text-uppercase text-muted small mb-2">Connected</h6>
  <ul id="voiceConnectedList" class="voice-member-list list-unstyled mb-0"></ul>

  <p class="text-muted small mt-4 mb-0">
    <i class="bi bi-info-circle me-1"></i>
    Best with up to ~4 participants per room. In production, getUserMedia requires HTTPS.
  </p>

  <div id="voiceAudioRoot" hidden></div>
</div>

# Render.com Blueprint - one-click deploy.
#
# Use this file via "New + > Blueprint" in the Render dashboard, point it at
# the GitHub repo, and Render provisions both the web service and the
# Postgres database with the env vars wired up.
#
# After the first deploy you must still set DJANGO_ALLOWED_HOSTS and
# DJANGO_CSRF_TRUSTED_ORIGINS in the Render dashboard (sync: false below)
# because they depend on the final .onrender.com hostname.

services:
  - type: web
    name: discord-django
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    startCommand: daphne -b 0.0.0.0 -p $PORT discord_django.asgi:application
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discord-django-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: discord-django-db
    plan: free
    databaseName: discord_django
    user: discord
    region: frankfurt
